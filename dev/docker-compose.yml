version: '3.9'

services:
  local-postgres-db:
    image: postgres
    ports:
      - 5432:5432
    environment:
      - POSTGRES_PASSWORD=mailreader
      - POSTGRES_USER=mailreader
      - POSTGRES_DB=mail

