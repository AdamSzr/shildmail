{% extends "base.html" %}

{% block title %}
  2FA - ShildMail
{% endblock %}
{% block scripts %}
    <script>
      const csrfToken = "{{ csrf_token }}";
    </script>
    <script src="https://unpkg.com/@simplewebauthn/browser/dist/bundle/index.umd.min.js"></script>
{% endblock %}



{% block content %}

  <!-- Nagłówek -->
  {% include 'partials/header.html' %}


  <div class="d-flex flex-column justify-content-center align-items-center vh-100">
    <!-- Nagłówek -->
    <h1 class="mb-4 text-center">Podwójne uwierzytelnianie</h1>

    <!-- Przycisk Autoryzacji -->
    <button id="auth" class="btn btn-primary btn-lg mb-3" onclick="device_auth()">
      Uwierzytelnij
    </button>
</div>

  <script>
     async function device_auth() {
      authenticationOptionsJSON = await fetch('/api/webauthn')
      .then(it => it.json())


      const assertionResp = await SimpleWebAuthnBrowser.startAuthentication({
        optionsJSON: authenticationOptionsJSON
      });

      const apiAuthVerResp = await fetch('/api/webauthn', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-CSRFToken':csrfToken },
        body: JSON.stringify(assertionResp),
      })
      .then( it => it.json() )
      .then(response => response.redirect && (window.location.href = response.redirect))
    }
  </script>

{% endblock %}
