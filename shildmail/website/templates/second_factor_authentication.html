{% extends "base.html" %}

{% block title %}
  2FA - ShildMail
{% endblock %}
{% block scripts %}
    <script>
      const csrfToken = "{{ csrf_token }}";
    </script>
    <script src="https://unpkg.com/@simplewebauthn/browser/dist/bundle/index.umd.min.js"></script>
{% endblock %}



{% block content %}

  <!-- Nagłówek -->
  {% include 'partials/header.html' %}


  <div class="d-flex flex-column justify-content-center align-items-center vh-100">
    <!-- Nagłówek -->
    <h1 class="mb-4 text-center">Second Factor Authentication</h1>

    <!-- Przycisk Autoryzacji -->
    <button id="auth" class="btn btn-primary btn-lg mb-3" onclick="device_auth()">
        Autoryzuj
    </button>
</div>

  {% comment %} <h1>Second Factor Authentication</h1>
  <button id='auth' onclick='device_auth()' >
    Autoryzuj
  </button>

  <a class='btn' href='/register-credentials'>Dodaj authenticator</a>
 {% endcomment %}

  <script>
     async function device_auth() {
      authenticationOptionsJSON = await fetch('/api/webauthn')
      .then(it => it.json())

      console.log('AUTHENTICATION OPTIONS')
      console.log(authenticationOptionsJSON)

      const authResp = await SimpleWebAuthnBrowser.startAuthentication({
        optionsJSON: authenticationOptionsJSON
      });

      console.log('AUTHENTICATION RESPONSE');
      console.log(authResp);

      const apiAuthVerResp = await fetch('/api/webauthn', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-CSRFToken':csrfToken },
        body: JSON.stringify(authResp),
      })
      .then(response => response.redirected && (window.location.href = response.url))
  
// # Simple Options
// simple_authentication_options = generate_authentication_options(rp_id="example.com")
// 
// print("\n[Authentication Options - Simple]")
// print(options_to_json(simple_authentication_options))

    }
  </script>

{% endblock %}
