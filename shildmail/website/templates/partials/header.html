<nav class="navbar bg-body-tertiary">
    <div class="container-fluid">
        <!-- Logo lub marka -->
        <a href="/" class="navbar-brand">ShildMail</a>

        <!-- Przycisk Logout wyrównany do prawej -->
        <button class="btn btn-outline-success ms-auto" onclick="logout()">Logout</button>
    </div>
</nav>

<script>
    function logout(){
        fetch('/api/logout', {redirect: 'follow'})
        .then(response => response.redirected && (window.location.href = response.url) )
    }
</script>
