{% extends "base.html" %}

{% block title %}
  Register Credentials - ShildMail
{% endblock %}
{% block scripts %}
<script src="https://unpkg.com/@simplewebauthn/browser/dist/bundle/index.umd.min.js"></script>
<script>
        const csrfToken = "{{ csrf_token }}";
</script>
{% endblock %}


{% block content %}

  <!-- Nagłówek -->
  {% include 'partials/header.html' %}

  <div class="d-flex flex-column align-items-center justify-content-center vh-100">
    <h1>Rejestrowanie urządzeń uwierzytelniających</h1>
    <button onclick="registerCred()" class="btn btn-primary mt-3">Dodaj urządzenie</button>
</div>

  <script>
      const uuid = "{{ uuid }}";
      console.log(uuid)

     async function registerCred(){
      if(!uuid) return console.error('No uuid in javascript')
      registrationOptionsJSON = await fetch('/api/register-device?uuid='+uuid).then(resp => resp.json())

      if('error' in registrationOptionsJSON){
        console.log(registrationOptionsJSON)
        registrationOptionsJSON.redirect && (window.location.href = registrationOptionsJSON.redirect)
      }
      
      const deviceRegistrationResp = await SimpleWebAuthnBrowser.startRegistration({ optionsJSON: registrationOptionsJSON });

      await fetch('/api/register-device?uuid='+uuid, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-CSRFToken':csrfToken },
        body: JSON.stringify(deviceRegistrationResp),
      })
      .then(response => response.json() )
      .then(r => {
        console.log(r)
        r.redirect && (window.location.href = response.redirect)
      } )
    }
  </script>

{% endblock %}
