{% extends "base.html" %}

{% block title %}
  Register Credentials - ShildMail
{% endblock %}
{% block scripts %}
<script src="https://unpkg.com/@simplewebauthn/browser/dist/bundle/index.umd.min.js"></script>
<script>
        const csrfToken = "{{ csrf_token }}";
</script>
{% endblock %}


{% block content %}

  <!-- Nagłówek -->
  {% include 'partials/header.html' %}


  <h1>Register Credentials</h1>
  <button onclick="registerCred()"> start registration </button>
  <script>
     async function registerCred(){
      registrationOptionsJSON = await fetch('/api/register-device')
      .then(resp => resp.json())

      console.log('REGISTRATION OPTIONS')
      console.log(registrationOptionsJSON)

      const deviceRegistrationResp = await SimpleWebAuthnBrowser.startRegistration({ optionsJSON: registrationOptionsJSON });

      console.log('REGISTRATION RESPONSE')
      console.log(deviceRegistrationResp)

      const apiRegistartionVerificationResp = await fetch('/api/register-device', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-CSRFToken':csrfToken },
        body: JSON.stringify(deviceRegistrationResp),
        redirect: 'follow'
      })
      .then(response => response.redirected && (window.location.href = response.url))

      console.log(apiRegistartionVerificationResp)
    }

  </script>

{% endblock %}
