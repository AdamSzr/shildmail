{% extends "base.html" %}

{% block title %}
  Register Credentials - ShildMail
{% endblock %}
{% block scripts %}
<script src="https://unpkg.com/@simplewebauthn/browser/dist/bundle/index.umd.min.js"></script>
<script>
        const csrfToken = "{{ csrf_token }}";
</script>

<script>
  function c(){
    console.error(123)
  }
</script>
{% endblock %}


{% block content %}

  <!-- Nagłówek -->
  {% include 'partials/header.html' %}

  <div class="d-flex flex-column align-items-center justify-content-center vh-100">
    <h1>Rejestrowanie urządzeń uwierzytelniających</h1>
    <button onclick="registerCred()" class="btn btn-primary mt-3">Dodaj urządzenie</button>
    <button onclick="c()" class="btn btn-primary mt-3">Dodaj c</button>
</div>

  <script>

    const uuid = "{{ uuid }}";

    async function registerCred(){
      if(!uuid) return console.error('No uuid in javascript')
      const registrationOptionsJSON = await loadCredentialRequestOptions() // Pobarnie parametrów rejestracji z serwera
      // Rozpoczęcie rejestracji poprzez przekazanie opcji do urządzenia autoryzującego
      const attestationResp = await SimpleWebAuthnBrowser.startRegistration({ optionsJSON: registrationOptionsJSON });
      // Przesłanie do serwera AuthenticatorAttestationResponse
      await sendRegistartionAuthenticatorResponse(attestationResp)
    }

    async function sendRegistartionAuthenticatorResponse(deviceRegistrationResp){
      await fetch('/api/register-device?uuid='+uuid, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-CSRFToken':csrfToken },
        body: JSON.stringify(deviceRegistrationResp),
      })
      .then(response => response.json() )
      .then(r => r.redirect && (window.location.href = r.redirect) )
    }

    function loadCredentialRequestOptions(){
      return fetch('/api/register-device?uuid='+uuid).then(resp => resp.json())
    }
  </script>

{% endblock %}
